name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore RadioWindows.sln

      - name: Build
        run: dotnet build RadioWindows.sln -c Release --no-restore

      - name: Test
        run: dotnet test tests/RadioWindows.Core.Tests/RadioWindows.Core.Tests.csproj -c Release --no-build --logger "trx;LogFileName=core.trx"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: "**/*.trx"
          if-no-files-found: ignore

  package:
    name: Windows package
    needs: build
    # Dependabot updates to workflow actions do not touch the app; skip the heavy job.
    if: github.actor != 'dependabot[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: UI tests (headless)
        run: dotnet test tests/RadioWindows.UiTests/RadioWindows.UiTests.csproj -c Release --logger "trx;LogFileName=ui.trx"

      - name: BASS audio smoke test
        shell: pwsh
        run: |
          dotnet run --project tools/AudioProbe/AudioProbe.csproj -c Release -- "https://ice1.somafm.com/groovesalad-128-mp3" 8 eq --nosound
          if ($LASTEXITCODE -ne 0) { throw "MP3 playback or BASS_FX equalizer failed" }
          dotnet run --project tools/AudioProbe/AudioProbe.csproj -c Release -- "https://rusradio.hostingradio.ru/rusradio96.aacp" 8 --nosound
          if ($LASTEXITCODE -ne 0) { throw "AAC playback failed" }
          dotnet run --project tools/AudioProbe/AudioProbe.csproj -c Release -- "https://stream.radioparadise.com/rock-128" 8 --nosound
          if ($LASTEXITCODE -ne 0) { throw "ICY metadata probe failed" }

      - name: BASS HLS probe (informational)
        continue-on-error: true
        shell: pwsh
        run: dotnet run --project tools/AudioProbe/AudioProbe.csproj -c Release -- "https://h.getradio.me/spdeep/hls.m3u8" 8 --nosound

      - name: Publish
        shell: pwsh
        run: ./scripts/publish.ps1 -Version 0.0.0-ci

      - uses: actions/upload-artifact@v4
        with:
          name: radiowindows-ci
          path: |
            dist/RadioWindows-Portable.zip
            dist/RadioWindows-Setup.exe
            dist/SHA256SUMS.txt
            tests/RadioWindows.UiTests/bin/Release/net10.0/screenshots/**
          if-no-files-found: error
