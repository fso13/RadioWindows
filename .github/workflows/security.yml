name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 4 * * 1'

permissions:
  contents: read

jobs:
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore RadioWindows.sln

      - name: Vulnerable packages
        run: |
          dotnet list RadioWindows.sln package --vulnerable --include-transitive 2>&1 | tee packages.txt
          ! grep -qi "has the following vulnerable" packages.txt

  dependency-review:
    # Dependabot PRs run with a read-only token and a synthetic dependency graph,
    # which the review action cannot diff; the vulnerability scan above still runs.
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
